<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature Flags · Invofox Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="style.css">
  <script>(function(){var t=localStorage.getItem('invofox-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <style>
    .flags-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .flags-header h2 { font-size: 1.4rem; font-weight: 600; color: var(--text-primary); }
    .flags-header small { color: var(--text-muted); display: block; font-size: 0.8rem; margin-top: 2px; }

    .flag-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: var(--transition);
    }
    .flag-card:hover { border-color: var(--border-light); }
    .flag-card.archived { opacity: 0.5; }

    .flag-toggle { flex-shrink: 0; }
    .toggle-btn {
      width: 44px; height: 24px; border-radius: 12px; border: none; cursor: pointer;
      position: relative; transition: background 0.2s; background: var(--border);
    }
    .toggle-btn.on { background: var(--primary); }
    .toggle-btn::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%; background: white;
      transition: left 0.2s;
    }
    .toggle-btn.on::after { left: 23px; }

    .flag-info { flex: 1; min-width: 0; }
    .flag-key { font-family: monospace; font-size: 1rem; color: var(--primary-light); font-weight: 700; margin-bottom: 1px; }
    .flag-name { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 3px; }
    .flag-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .flag-tag {
      display: inline-block; padding: 1px 8px; border-radius: 4px;
      font-size: 0.75rem; font-weight: 500;
    }
    .tag-boolean { background: rgba(129,140,248,0.15); color: var(--primary-light); }
    .tag-multivariate { background: rgba(251,191,36,0.15); color: var(--warning); }
    .tag-string, .tag-number { background: rgba(52,211,153,0.15); color: var(--success); }
    .tag-archived { background: rgba(248,113,113,0.15); color: var(--danger); }

    .flag-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-sm {
      padding: 8px 18px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: var(--text-secondary); cursor: pointer;
      font-size: 0.85rem; font-weight: 500; transition: var(--transition);
    }
    .btn-sm:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-light); }
    .btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* Create form */
    .create-section {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px; margin-bottom: 24px;
    }
    .create-section h3 { margin-bottom: 16px; font-size: 1rem; color: var(--text-secondary); }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .form-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
    .form-field label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .form-field input, .form-field select {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-primary);
      padding: 8px 10px; font-size: 0.9rem; transition: var(--transition);
    }
    .form-field input:focus, .form-field select:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow);
    }
    .form-field select option { background: var(--bg-secondary); }
    .btn-primary {
      padding: 8px 20px; border-radius: var(--radius); border: none;
      background: var(--primary); color: white; cursor: pointer;
      font-size: 0.9rem; font-weight: 500; transition: var(--transition);
      min-width: 100px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary.success { background: var(--success); }

    /* Modal */
    .ff-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 500; align-items: center; justify-content: center;
    }
    .ff-overlay.open { display: flex; }
    .ff-dialog {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 36px 40px; width: 820px; max-width: 95vw;
      box-shadow: var(--shadow-xl);
    }
    .ff-dialog h3 { margin-bottom: 16px; }
    .ff-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .ff-btn-cancel {
      padding: 8px 18px; border-radius: var(--radius); border: 1px solid var(--border);
      background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 0.9rem;
    }
    .ff-btn-danger {
      padding: 8px 18px; border-radius: var(--radius); border: none;
      background: var(--danger); color: white; cursor: pointer; font-size: 0.9rem; font-weight: 500;
    }

    /* Audit log modal */
    .audit-list { max-height: 600px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .audit-entry {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 12px; font-size: 0.82rem;
    }
    .audit-entry-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .audit-action {
      font-weight: 600; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.06em;
      padding: 1px 7px; border-radius: 4px;
    }
    .action-created { background: rgba(52,211,153,0.15); color: var(--success); }
    .action-updated { background: rgba(129,140,248,0.15); color: var(--primary-light); }
    .action-toggled { background: rgba(251,191,36,0.15); color: var(--warning); }
    .action-archived { background: rgba(248,113,113,0.15); color: var(--danger); }
    .action-deleted { background: rgba(248,113,113,0.2); color: var(--danger); }
    .audit-time { color: var(--text-muted); font-size: 0.78rem; }
    .audit-diff { color: var(--text-muted); font-family: monospace; font-size: 0.78rem; word-break: break-all; }
    .audit-diff em { color: var(--text-secondary); font-style: normal; }

    /* Confirm modal — stays compact */
    .ff-dialog.confirm-dialog { width: 480px; }

    /* Search box */
    .search-wrap { position: relative; flex: 1; max-width: 340px; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-muted); pointer-events: none; }
    #search-input {
      width: 100%; padding: 7px 10px 7px 32px;
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-primary); font-size: 0.88rem;
      transition: var(--transition);
    }
    #search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
    #search-input::placeholder { color: var(--text-muted); }
    .confirm-msg { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; }

    .filter-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .filter-bar label { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .empty-state { text-align: center; padding: 48px; color: var(--text-muted); }
    #toast {
      position: fixed; bottom: 24px; right: 24px; padding: 10px 18px;
      border-radius: var(--radius); background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-primary); font-size: 0.9rem; box-shadow: var(--shadow-lg);
      opacity: 0; transition: opacity 0.3s; z-index: 200;
    }
    #toast.show { opacity: 1; }
    #toast.success { border-color: var(--success); }
    #toast.error { border-color: var(--danger); }

    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; transition: var(--transition); }
    .back-link:hover { color: var(--text-primary); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 13px; height: 13px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
      animation: spin 0.55s linear infinite; vertical-align: middle;
    }
    .toggle-btn.loading { opacity: 0.55; cursor: wait; pointer-events: none; }
    @keyframes toggle-pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 0.85; } }
    .toggle-btn.loading { animation: toggle-pulse 0.6s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← Back to Admin</a>

    <div class="flags-header">
      <div>
        <h2>🚩 Feature Flags</h2>
        <small>Real-time toggles · Changes propagate in &lt;5s · No redeployment needed</small>
      </div>
    </div>

    <!-- Create Flag -->
    <div class="create-section">
      <h3>Create New Flag</h3>
      <div class="form-row">
        <div class="form-field" style="flex: 1.5">
          <label>Key</label>
          <input type="text" id="new-key" placeholder="new-receipt-flow"
            pattern="[a-z0-9-]+" maxlength="60"
            oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'')" />
        </div>
        <div class="form-field" style="flex: 2">
          <label>Description</label>
          <input type="text" id="new-description" placeholder="What does this flag control?" maxlength="200" />
        </div>
        <div class="form-field">
          <label>Type</label>
          <select id="new-type">
            <option value="boolean">Boolean</option>
            <option value="multivariate">Multivariate</option>
            <option value="string">String</option>
            <option value="number">Number</option>
          </select>
        </div>
        <div class="form-field" style="flex: 0; justify-content: flex-end; padding-top: 20px">
          <button class="btn-primary" id="create-btn" onclick="createFlag()">+ Create</button>
        </div>
      </div>
    </div>

    <!-- Flags List -->
    <div class="filter-bar">
      <div class="search-wrap">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="8.5" cy="8.5" r="5.5"/><path d="M15 15l-3.5-3.5"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search by key or description…" oninput="filterFlags()" />
      </div>
      <label>
        <input type="checkbox" id="show-archived" onchange="loadFlags()"> Show archived
      </label>
      <span id="flags-count" style="margin-left: auto; font-size: 0.8rem; color: var(--text-muted)"></span>
    </div>

    <div id="flags-list">
      <div class="empty-state">Loading flags...</div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="ff-overlay" id="edit-modal">
    <div class="ff-dialog">
      <h3>Edit Flag: <span id="edit-modal-key" style="color:var(--primary-light); font-family:monospace"></span></h3>
      <input type="hidden" id="edit-key" />
      <div class="form-row">
        <div class="form-field" style="flex:2">
          <label>Description</label>
          <input type="text" id="edit-description-main" maxlength="200" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Default Value (when no targeting match)</label>
          <select id="edit-default-value">
            <option value="false">false</option>
            <option value="true">true</option>
          </select>
        </div>
        <div class="form-field">
          <label>Percentage Rollout (%)</label>
          <input type="number" id="edit-percentage" min="0" max="100" placeholder="0–100" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-field" style="flex:2">
          <label>Target Chat IDs (comma-separated)</label>
          <input type="text" id="edit-chats" placeholder="123456, 789012" />
        </div>
      </div>
      <div class="ff-actions">
        <button class="ff-btn-cancel" onclick="closeModal('edit-modal')">Cancel</button>
        <button class="btn-primary" onclick="saveFlag()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Audit Log Modal -->
  <div class="ff-overlay" id="audit-modal">
    <div class="ff-dialog">
      <h3>Audit Log: <span id="audit-modal-key" style="color:var(--primary-light); font-family:monospace"></span></h3>
      <div id="audit-list" class="audit-list"></div>
      <div class="ff-actions">
        <button class="ff-btn-cancel" onclick="closeModal('audit-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div class="ff-overlay" id="confirm-modal">
    <div class="ff-dialog confirm-dialog">
      <h3 id="confirm-title"></h3>
      <p class="confirm-msg" id="confirm-msg"></p>
      <div class="ff-actions">
        <button class="ff-btn-cancel" onclick="closeModal('confirm-modal')">Cancel</button>
        <button class="ff-btn-danger" id="confirm-ok">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const API = '/api/feature-flags';
    let allFlags = [];

    async function api(path, options = {}) {
      const res = await fetch(API + path, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `show ${type}`;
      setTimeout(() => el.className = '', 3000);
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    // Escape key closes open modal
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.querySelectorAll('.ff-overlay.open').forEach(el => closeModal(el.id));
    });

    function showConfirm(title, msg, onConfirm, confirmLabel = 'Confirm') {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-msg').textContent = msg;
      const btn = document.getElementById('confirm-ok');
      btn.textContent = confirmLabel;
      btn.onclick = () => { closeModal('confirm-modal'); onConfirm(); };
      openModal('confirm-modal');
    }

    function typeTag(type) {
      return `<span class="flag-tag tag-${type}">${type}</span>`;
    }

    function targetingSummary(flag) {
      const parts = [];
      if (flag.targets?.chats?.length) parts.push(`${flag.targets.chats.length} chat(s)`);
      if (flag.targets?.users?.length) parts.push(`${flag.targets.users.length} user(s)`);
      if (flag.targets?.percentage > 0) parts.push(`${flag.targets.percentage}% rollout`);
      if (!parts.length) return flag.defaultValue ? 'All (default: on)' : 'None (default: off)';
      return parts.join(' · ');
    }

    async function loadFlags() {
      const includeArchived = document.getElementById('show-archived').checked;
      const list = document.getElementById('flags-list');
      try {
        const { flags } = await api(`?includeArchived=${includeArchived}`);
        allFlags = flags;
        filterFlags();
      } catch (e) {
        list.innerHTML = `<div class="empty-state" style="color:var(--danger)">${e.message}</div>`;
      }
    }

    function filterFlags() {
      const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
      const list = document.getElementById('flags-list');

      const visible = q
        ? allFlags.filter(f => f.key.includes(q) || (f.description || '').toLowerCase().includes(q))
        : allFlags;

      document.getElementById('flags-count').textContent =
        q ? `${visible.length} of ${allFlags.length} flag${allFlags.length !== 1 ? 's' : ''}`
          : `${allFlags.length} flag${allFlags.length !== 1 ? 's' : ''}`;

      if (!visible.length) {
        list.innerHTML = q
          ? `<div class="empty-state">No flags match "<strong>${q}</strong>".</div>`
          : '<div class="empty-state">No flags yet. Create one above.</div>';
        return;
      }

      list.innerHTML = visible.map(flag => `
        <div class="flag-card ${flag.archived ? 'archived' : ''}" id="card-${flag.key}">
          <div class="flag-toggle">
            <button
              class="toggle-btn ${flag.enabled ? 'on' : ''}"
              onclick="toggle('${flag.key}')"
              title="${flag.enabled ? 'Disable' : 'Enable'}"
              ${flag.archived ? 'disabled' : ''}
            ></button>
          </div>
          <div class="flag-info">
            <div class="flag-key">${flag.key}</div>
            <div class="flag-name">${flag.description || ''}</div>
            <div class="flag-meta">
              ${typeTag(flag.type)}
              ${flag.archived ? '<span class="flag-tag tag-archived">archived</span>' : ''}
              <span>${targetingSummary(flag)}</span>
            </div>
          </div>
          <div class="flag-actions">
            <button class="btn-sm" onclick="openEdit('${flag.key}')">Edit</button>
            <button class="btn-sm" onclick="viewAudit('${flag.key}')">Audit</button>
            ${!flag.archived
              ? `<button class="btn-sm danger" onclick="archive('${flag.key}')">Archive</button>`
              : `<button class="btn-sm danger" onclick="deletePermanently('${flag.key}')">Delete</button>`
            }
          </div>
        </div>
      `).join('');
    }

    async function toggle(key) {
      const card = document.getElementById(`card-${key}`);
      const btn = card ? card.querySelector('.toggle-btn') : null;
      if (btn) btn.classList.add('loading');
      try {
        const { enabled } = await api(`/${key}/toggle`, { method: 'PATCH' });
        toast(`${key}: ${enabled ? 'enabled ✓' : 'disabled'}`, enabled ? 'success' : '');
        loadFlags();
      } catch (e) {
        toast(e.message, 'error');
        if (btn) btn.classList.remove('loading');
      }
    }

    function archive(key) {
      showConfirm(
        `Archive '${key}'?`,
        'The flag will be disabled and hidden by default. You can still view it with "Show archived".',
        async () => {
          try {
            await api(`/${key}/archive`, { method: 'PATCH' });
            toast(`'${key}' archived`);
            loadFlags();
          } catch (e) {
            toast(e.message, 'error');
          }
        },
        'Archive'
      );
    }

    function deletePermanently(key) {
      showConfirm(
        `Delete '${key}'?`,
        'This will permanently remove the flag and all its audit history. This cannot be undone.',
        async () => {
          try {
            await api(`/${key}`, { method: 'DELETE' });
            toast(`'${key}' deleted`);
            loadFlags();
          } catch (e) {
            toast(e.message, 'error');
          }
        },
        'Delete permanently'
      );
    }

    async function createFlag() {
      const key = document.getElementById('new-key').value.trim();
      const description = document.getElementById('new-description').value.trim();
      const type = document.getElementById('new-type').value;

      if (!key || !description) return toast('Key and description are required', 'error');

      const btn = document.getElementById('create-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        await api('', {
          method: 'POST',
          body: JSON.stringify({ key, description, type, enabled: false, defaultValue: false }),
        });

        btn.textContent = '✓ Created';
        btn.classList.add('success');
        btn.disabled = false;
        document.getElementById('new-key').value = '';
        document.getElementById('new-description').value = '';
        loadFlags();

        setTimeout(() => {
          btn.textContent = '+ Create';
          btn.classList.remove('success');
        }, 1500);
      } catch (e) {
        toast(e.message, 'error');
        btn.textContent = '+ Create';
        btn.disabled = false;
      }
    }

    async function openEdit(key) {
      try {
        const { flag } = await api(`/${key}`);
        document.getElementById('edit-key').value = key;
        document.getElementById('edit-modal-key').textContent = key;
        document.getElementById('edit-description-main').value = flag.description || '';
        document.getElementById('edit-default-value').value = String(flag.defaultValue ?? false);
        document.getElementById('edit-percentage').value = flag.targets?.percentage ?? '';
        document.getElementById('edit-chats').value = (flag.targets?.chats || []).join(', ');
        openModal('edit-modal');
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function saveFlag() {
      const key = document.getElementById('edit-key').value;
      const description = document.getElementById('edit-description-main').value.trim();
      const defaultValue = document.getElementById('edit-default-value').value === 'true';
      const pct = document.getElementById('edit-percentage').value;
      const chatsRaw = document.getElementById('edit-chats').value;

      const chats = chatsRaw
        ? chatsRaw.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n))
        : [];
      const percentage = pct !== '' ? parseInt(pct, 10) : 0;

      const btn = document.querySelector('#edit-modal .btn-primary');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        await api(`/${key}`, {
          method: 'PUT',
          body: JSON.stringify({ description, defaultValue, targets: { chats, percentage } }),
        });
        btn.textContent = '✓ Saved';
        btn.classList.add('success');
        setTimeout(() => {
          closeModal('edit-modal');
          btn.textContent = 'Save Changes';
          btn.classList.remove('success');
          btn.disabled = false;
        }, 800);
        loadFlags();
      } catch (e) {
        toast(e.message, 'error');
        btn.textContent = 'Save Changes';
        btn.disabled = false;
      }
    }

    async function viewAudit(key) {
      document.getElementById('audit-modal-key').textContent = key;
      const listEl = document.getElementById('audit-list');
      listEl.innerHTML = '<div style="color:var(--text-muted);padding:16px 0">Loading…</div>';
      openModal('audit-modal');

      try {
        const { entries } = await api(`/${key}/audit`);
        if (!entries.length) {
          listEl.innerHTML = '<div style="color:var(--text-muted);padding:16px 0">No audit entries yet.</div>';
          return;
        }

        listEl.innerHTML = entries.map(e => {
          const ts = e.timestamp?._seconds
            ? new Date(e.timestamp._seconds * 1000).toLocaleString()
            : 'unknown time';
          const actionClass = `action-${e.action}`;
          const diff = formatDiff(e.action, e.previousValue, e.newValue);
          return `
            <div class="audit-entry">
              <div class="audit-entry-header">
                <span class="audit-action ${actionClass}">${e.action}</span>
                <span class="audit-time">${ts}</span>
              </div>
              ${diff ? `<div class="audit-diff">${diff}</div>` : ''}
            </div>`;
        }).join('');
      } catch (e) {
        listEl.innerHTML = `<div style="color:var(--danger)">${e.message}</div>`;
      }
    }

    function formatDiff(action, prev, next) {
      if (action === 'toggled') {
        return `<em>${prev ? 'enabled' : 'disabled'}</em> → <em>${next ? 'enabled' : 'disabled'}</em>`;
      }
      if (action === 'created' && next && typeof next === 'object') {
        const { description, type, enabled } = next;
        return [
          description ? `desc: ${description}` : '',
          type ? `type: ${type}` : '',
          `enabled: ${enabled}`,
        ].filter(Boolean).join(' · ');
      }
      if (action === 'updated' && next && typeof next === 'object') {
        return Object.entries(next)
          .filter(([k]) => k !== 'updatedAt')
          .map(([k, v]) => `${k}: ${JSON.stringify(v)}`)
          .join(' · ');
      }
      return '';
    }

    // Close modals on backdrop click
    document.querySelectorAll('.ff-overlay').forEach(el => {
      el.addEventListener('click', function(e) { if (e.target === this) closeModal(this.id); });
    });

    loadFlags();
  </script>
  <script src="/theme.js"></script>
</body>
</html>
