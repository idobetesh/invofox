name: Cleanup Docker Images

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: idobet21
  PROJECT_ID: papertrail-invoice
  REGION: us-central1
  KEEP_IMAGES: 12

jobs:
  cleanup:
    name: Cleanup ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [webhook-handler, worker]

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve protected tags
        id: prod
        run: |
          set -euo pipefail
          SERVICE='${{ matrix.service }}'
          PROTECT=()

          add_tag_from_image() {
            local ref="$1"
            if [[ "$ref" == *@sha256:* ]]; then
              return 0
            fi
            local tag="${ref##*:}"
            if [ -n "$tag" ] && [ "$tag" != "$ref" ]; then
              PROTECT+=("$tag")
            fi
          }

          REV="$(gcloud run services describe "$SERVICE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format='value(status.traffic[0].revisionName)')"
          if [ -n "$REV" ]; then
            IMG="$(gcloud run revisions describe "$REV" \
              --region "${{ env.REGION }}" \
              --project "${{ env.PROJECT_ID }}" \
              --format='value(spec.containers[0].image)')"
            add_tag_from_image "$IMG"
          fi

          TPL="$(gcloud run services describe "$SERVICE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format='value(spec.template.spec.containers[0].image)')"
          add_tag_from_image "$TPL"

          if [ "${#PROTECT[@]}" -eq 0 ]; then
            echo "protected=" >> "$GITHUB_OUTPUT"
            echo "Protected tags: (none with tag suffix; digest-only refs skipped)"
            exit 0
          fi

          UNIQUE="$(printf '%s\n' "${PROTECT[@]}" | sort -u | paste -sd, -)"
          echo "protected=$UNIQUE" >> "$GITHUB_OUTPUT"
          echo "Protected tags: $UNIQUE"

      - name: Get Docker Hub JWT Token
        id: auth
        run: |
          set -euo pipefail
          TOKEN="$(curl -s -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${{ env.DOCKERHUB_USERNAME }}\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            | jq -r '.token')"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to authenticate with Docker Hub"
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Delete unneeded tags
        id: delete
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          PROTECTED: ${{ steps.prod.outputs.protected }}
        run: |
          set -euo pipefail
          NAMESPACE="${{ env.DOCKERHUB_USERNAME }}"
          REPO="${{ matrix.service }}"
          KEEP="${{ env.KEEP_IMAGES }}"

          TAGS_JSON='[]'
          URL="https://hub.docker.com/v2/namespaces/${NAMESPACE}/repositories/${REPO}/tags?page_size=100"
          while [ -n "$URL" ]; do
            RESP="$(curl -s -H "Authorization: Bearer $TOKEN" "$URL")"
            TAGS_JSON="$(jq -n --argjson acc "$TAGS_JSON" --argjson resp "$RESP" \
              '$acc + ($resp.results // [])')"
            URL="$(echo "$RESP" | jq -r '.next // empty')"
          done

          TOTAL="$(echo "$TAGS_JSON" | jq 'length')"
          echo "total_images=$TOTAL" >> "$GITHUB_OUTPUT"

          if [ "$TOTAL" -eq 0 ]; then
            echo "deleted_count=0" >> "$GITHUB_OUTPUT"
            echo "failed_count=0" >> "$GITHUB_OUTPUT"
            echo "No tags found"
            exit 0
          fi

          mapfile -t TAGS_TO_DELETE < <(echo "$TAGS_JSON" | jq -r --argjson keep "$KEEP" --arg protected "$PROTECTED" '
            ($protected | if length > 0 then split(",") else [] end) as $prot |
            sort_by(.last_pushed) | reverse as $sorted |
            ($sorted[0:$keep] | map(.name)) as $recent |
            ((["latest"] + $prot + $recent) | unique) as $keep_set |
            $sorted | map(.name) | .[] | select(. as $t | ($keep_set | index($t)) | not)
          ')

          if [ "${#TAGS_TO_DELETE[@]}" -eq 0 ]; then
            echo "deleted_count=0" >> "$GITHUB_OUTPUT"
            echo "failed_count=0" >> "$GITHUB_OUTPUT"
            echo "Nothing to delete"
            exit 0
          fi

          DELETED=0
          FAILED=0
          for tag in "${TAGS_TO_DELETE[@]}"; do
            [ -z "$tag" ] && continue
            HTTP_CODE="$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $TOKEN" \
              "https://hub.docker.com/v2/namespaces/${NAMESPACE}/repositories/${REPO}/tags/${tag}")"
            if [ "$HTTP_CODE" = "202" ] || [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "Deleted tag: $tag"
              DELETED=$((DELETED + 1))
            else
              echo "Failed to delete tag: $tag (HTTP $HTTP_CODE)"
              FAILED=$((FAILED + 1))
            fi
            sleep 0.3
          done

          echo "deleted_count=$DELETED" >> "$GITHUB_OUTPUT"
          echo "failed_count=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Cleanup Summary for ${{ matrix.service }}"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Total tags | ${{ steps.delete.outputs.total_images }} |"
            echo "| Keep (recent + latest + prod) | ${{ env.KEEP_IMAGES }} + protected |"
            echo "| Protected prod tags | ${{ steps.prod.outputs.protected || '—' }} |"
            echo "| Deleted | ${{ steps.delete.outputs.deleted_count || '0' }} |"
            echo "| Failed | ${{ steps.delete.outputs.failed_count || '0' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
