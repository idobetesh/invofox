name: Deploy

on:
  push:
    branches: [master]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'infra/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/**'
  workflow_dispatch: # Manual trigger (bypasses path filter)

env:
  PROJECT_ID: papertrail-invoice
  REGION: us-central1
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            services/webhook-handler/package-lock.json
            services/worker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Check Playwright / Node Docker version sync
        run: bash .github/scripts/check-playwright-version-sync.sh

      - name: Install service dependencies
        run: |
          (cd services/webhook-handler && npm ci)
          (cd services/worker && npm ci)

      - name: Lint
        run: |
          npm run lint:webhook
          npm run lint:worker

      - name: Build
        run: npm run build

      - name: Test webhook-handler
        run: cd services/webhook-handler && npm run test:ci

      - name: Test worker
        run: cd services/worker && npm run test:ci

  build:
    name: Build ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [webhook-handler, worker]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Playwright version (worker only)
        if: matrix.service == 'worker'
        id: playwright
        run: |
          VERSION=$(node -p "require('./services/worker/package-lock.json').packages['node_modules/playwright'].version")

          if [ -z "$VERSION" ]; then
            echo "Could not resolve playwright version from package-lock.json"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved PLAYWRIGHT_VERSION=$VERSION"

      - name: Build and push webhook-handler
        if: matrix.service == 'webhook-handler'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/webhook-handler/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/webhook-handler:${{ github.sha }}
            ${{ env.REGISTRY }}/webhook-handler:latest
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=webhook-handler
          cache-to: type=gha,mode=min,scope=webhook-handler
          provenance: false

      - name: Build and push worker
        if: matrix.service == 'worker'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/worker:${{ github.sha }}
            ${{ env.REGISTRY }}/worker:latest
          build-args: |
            APP_VERSION=${{ github.sha }}
            PLAYWRIGHT_VERSION=${{ steps.playwright.outputs.version }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=min,scope=worker
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false

      - name: Smoke test Playwright in worker image
        if: matrix.service == 'worker'
        run: |
          IMAGE="${{ env.REGISTRY }}/worker:${{ github.sha }}"

          docker pull "$IMAGE"

          docker run --rm --user pwuser "$IMAGE" node -e "
            const { chromium } = require('playwright');

            chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
            })
              .then((browser) => browser.close())
              .then(() => { console.log('Playwright launch OK'); })
              .catch((err) => { console.error(err); process.exit(1); });
          "

  deploy:
    name: Validate GHCR
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify public GHCR images
        run: |
          set -euo pipefail

          docker logout ghcr.io || true

          for SERVICE in webhook-handler worker; do
            IMAGE="${{ env.REGISTRY }}/${SERVICE}:${{ github.sha }}"

            echo "Checking anonymous access to $IMAGE"

            docker manifest inspect "$IMAGE" > /dev/null

            echo "Public image accessible: $IMAGE"
          done

      - name: Validate Cloud Run image imports
        run: |
          set -euo pipefail

          for SERVICE in webhook-handler worker; do
            IMAGE="${{ env.REGISTRY }}/${SERVICE}:${{ github.sha }}"
            TEST_SERVICE="ghcr-import-${SERVICE}"

            echo "Testing Cloud Run import: $IMAGE"

            # A deployment can fail because the test service lacks production
            # environment variables or secrets. That does not necessarily
            # indicate an image import failure.
            gcloud run deploy "$TEST_SERVICE" \
              --image "$IMAGE" \
              --region "${{ env.REGION }}" \
              --project "${{ env.PROJECT_ID }}" \
              --no-allow-unauthenticated \
              --min-instances 0 \
              --max-instances 1 \
              --memory 1Gi \
              --cpu 2 \
              --quiet || true

            REVISION=$(gcloud run services describe "$TEST_SERVICE" \
              --region "${{ env.REGION }}" \
              --project "${{ env.PROJECT_ID }}" \
              --format='value(status.latestCreatedRevisionName)')

            if [ -z "$REVISION" ]; then
              echo "::error::No revision was created for $TEST_SERVICE"
              exit 1
            fi

            echo "Created revision: $REVISION"

            gcloud run revisions describe "$REVISION" \
              --region "${{ env.REGION }}" \
              --project "${{ env.PROJECT_ID }}" \
              --format='yaml(status.conditions)'

            REASON=$(gcloud run revisions describe "$REVISION" \
              --region "${{ env.REGION }}" \
              --project "${{ env.PROJECT_ID }}" \
              --format='value(status.conditions[0].reason)')

            echo "Revision reason: $REASON"

            if [ "$REASON" = "ContainerImageImportFailed" ]; then
              echo "::error::Cloud Run failed to import $IMAGE"
              exit 1
            fi

            echo "No ContainerImageImportFailed reported for $SERVICE"
          done

      - name: Clean up test services
        if: always()
        run: |
          for SERVICE in webhook-handler worker; do
            gcloud run services delete "ghcr-import-${SERVICE}" \
              --region "${{ env.REGION }}" \
              --project "${{ env.PROJECT_ID }}" \
              --quiet || true
          done